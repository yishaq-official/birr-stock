name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: birrstock_db
          POSTGRES_USER: birrstock
          POSTGRES_PASSWORD: birrstock_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./birr-stock
        run: npm ci

      - name: Lint Frontend
        working-directory: ./birr-stock
        run: npm run lint

      - name: Build Frontend
        working-directory: ./birr-stock
        run: npm run build

      - name: Test Backend
        working-directory: ./backend
        run: npm test
